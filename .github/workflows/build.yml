name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l cmd internal)"
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build web UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build single binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -tags ui -trimpath -ldflags='-s -w' -o dist/opentambo ./cmd/opentambo
          tar -C dist -czf opentambo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz opentambo
          sha256sum opentambo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > opentambo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: opentambo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: opentambo-*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: opentambo-*
          merge-multiple: true
          path: dist
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
