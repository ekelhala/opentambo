name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate API types and fail on drift
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 -config api/oapi-codegen.yaml api/openapi.yaml
          (cd tools/tsgen && bun install --frozen-lockfile && bun run generate)
          git diff --exit-code internal/desk/api/gen.go ui/src/lib/api.gen.ts
      - name: Web UI tests
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run lint
      - name: Web UI type check against generated contract types
        working-directory: ui
        run: bunx tsc -b
  quality:
    # Formatting, pinned static analysis and complexity gates (issue #19).
    # Same commands as `make fmt-check lint`; thresholds and the complexity
    # baseline live in .golangci.yml and must never be loosened silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make fmt-check
      - run: make lint
  coverage:
    # Statement-coverage ratchet plus changed-line gate (issue #19). A
    # missing artifact fails; floors live in test/coverage-baseline.txt and
    # lowering one requires a policy note in the PR description.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Race+cover suite and floor enforcement
        run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error
  changed-coverage:
    # Changed executable lines must be >= 90% covered (issue #19). Runs on
    # both profiles: the unit profile from the coverage job and the merged
    # instrumented profile from the integration job, so paths only a real
    # process reaches (main(), CLI exit codes) are proven, not exempted.
    needs: [coverage, integration]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v5
        with:
          name: go-coverage
      - uses: actions/download-artifact@v5
        with:
          name: integration-coverage
      - run: make changed-coverage BASE_REF=origin/${{ github.base_ref }}
  integration:
    # Real OpenTambo binary (built with -cover) against the pinned real
    # llama-server build on CPU. Zero executed tests or any skip fails the
    # job inside the harness; this job gates releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Real-backend integration suite
        run: make test-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage.integration.out
          if-no-files-found: error
  build:
    needs: [test, quality, coverage, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build web UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build single binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -tags ui -trimpath -ldflags='-s -w' -o dist/opentambo ./cmd/opentambo
          tar -C dist -czf opentambo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz opentambo
          sha256sum opentambo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > opentambo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: opentambo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: opentambo-*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: opentambo-*
          merge-multiple: true
          path: dist
      - name: Publish tagged binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
